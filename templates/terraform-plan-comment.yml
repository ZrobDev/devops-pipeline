# Terraform plan on every PR, posted as a PR comment, with a READ-ONLY AWS role
# via OIDC. Modernised from Link-/ci-cd-intro staging.yml: $GITHUB_OUTPUT, SHA
# pins, and the plan text reaches the script through a file and env, never
# through ${{ }} interpolation (that is the template-injection zizmor fails on).
name: Terraform plan

on:
  pull_request:
    paths: [infra/**]

permissions: {}

concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      pull-requests: write   # the comment
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}   # a read-only role, distinct from the deploy role
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -input=false
      - run: terraform -chdir=infra validate
      - name: Plan (exit code captured, never hidden)
        id: plan
        run: |
          set +e
          terraform -chdir=infra plan -input=false -no-color -out=tfplan >plan.txt 2>&1
          echo "exit=$?" >>"$GITHUB_OUTPUT"
      - name: Comment the plan on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exit }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8').slice(0, 60000);
            const ok = process.env.PLAN_EXIT === '0';
            const head = ok ? 'succeeded' : `FAILED (exit ${process.env.PLAN_EXIT})`;
            const body = ['#### Terraform plan: ' + head, '',
              '<details><summary>Show plan</summary>', '', '```', plan, '```', '', '</details>'].join('\n');
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
      - name: Fail the job if the plan failed
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exit }}
        run: test "$PLAN_EXIT" = "0"
