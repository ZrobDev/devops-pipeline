# Active-tier repos only. rollout.sh appends uv/npm/docker entries where the
# manifests exist. Grouped + capped so 30 repos cannot flood the PR list.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
    cooldown: { default-days: 7 }   # zizmor dependabot-cooldown: let a bad release get yanked first
    open-pull-requests-limit: 5
