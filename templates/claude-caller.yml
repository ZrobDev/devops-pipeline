# On-demand Claude review: comment `@claude` on a PR. Owner only, no bots.
# Runs from the default branch's copy of this file (issue_comment semantics),
# so it works only after this file is merged. Logic lives in ZrobDev/devops-pipeline.
name: Claude review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.user.type != 'Bot' &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: ZrobDev/devops-pipeline/.github/workflows/claude-review.yml@v1   # own repo: tag; third parties: SHA
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
