# Deploy to AWS with OIDC: no stored AWS keys. The job's identity token
# (sub = repo:OWNER/REPO:environment:production) is exchanged for short-lived
# credentials of a role whose trust policy names exactly that sub and the
# audience sts.amazonaws.com. Modernised from Link-/ci-cd-intro cd-oidc.yaml.
# Required reviewers on the environment work on the Free plan only for PUBLIC repos.
name: Deploy (AWS)

on:
  push:
    branches: [main]
    paths: [infra/**]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-aws-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}   # repository variable; an ARN is not a secret
          role-session-name: gha-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"   # Dependabot does not bump this; the release skill does
          terraform_wrapper: false
      - run: terraform -chdir=infra init -input=false
      - run: terraform -chdir=infra apply -input=false -auto-approve
